name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run UI tests
        run: python -m pytest -q -p no:cacheprovider --alluredir allure-results --clean-alluredir
      - name: Save Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Allure HTML report
        if: always()
        run: npx --yes allure-commandline@2.29.0 generate allure-results --clean -o allure-report
      - name: Save Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
